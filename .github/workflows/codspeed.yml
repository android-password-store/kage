name: CodSpeed Benchmarks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: codspeed-macro
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Checkout CodSpeed JMH fork
      shell: bash
      run: |
        git submodule update --init third-party/codspeed-jvm
        git -C third-party/codspeed-jvm submodule update --init --recursive jmh-fork

    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version-file: .java-version

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      with:
        add-job-summary: always
        validate-wrappers: true

    - name: Build benchmarks
      shell: bash
      run: ./gradlew --no-configuration-cache jmhJar

    - name: Run the benchmarks
      uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
      with:
        mode: walltime
        run: ./gradlew --no-configuration-cache jmh
